<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9da" />
    <title>Daylight Almanac</title>
    <meta name="description" content="How the days change, anywhere on Earth: sunrise, sunset, twilight and day length through the year on a 3D globe and charts." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23efe9da'/><path d='M8 21a8 8 0 0 1 16 0z' fill='%231f4e8c'/><path d='M4 21.5h24' stroke='%2322201b' stroke-width='2'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap"
    />
    <script>
      // Pick the edition before the first paint so the night edition doesn't flash in light.
      try {
        const t = JSON.parse(localStorage.getItem('daylight.settings.v1') || '{}').theme;
        const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
